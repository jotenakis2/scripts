#!/usr/bin/env bash
# =============================================================================
# Configuration de private-data_backup.sh
#
# Ce fichier est du bash : il est « sourcé » par le script. Les tableaux sont
# déjà déclarés (`declare -A`) par le script, donc on les remplit sans
# `declare` (sinon ils deviendraient locaux et seraient ignorés).
#
# Emplacements recherchés (dans cet ordre) :
#   1. --config FICHIER
#   2. $PRIVATE_BACKUP_CONFIG
#   3. private_data_backup.conf à côté du script (liens symboliques résolus)
#   4. ${XDG_CONFIG_HOME:-$HOME/.config}/private-data_backup/config
#
# Toute variable absente retombe sur une valeur par défaut du script.
# Les variables PRIVATE_BACKUP_* de l'environnement ont le dernier mot
# (NAS, SUBDIR, ENCRYPT, GPG_RECIPIENT, AGE_RECIPIENT).
#
# Les quatre blocs délimités par « # >>> NOM » et « # <<< NOM » sont réécrits
# par `private-data_backup.sh profile-add|profile-remove` (et par la TUI) :
# laisse les commentaires EN DEHORS de ces bornes.
# =============================================================================

# -----------------------------------------------------------------------------
# Stockage
# -----------------------------------------------------------------------------
# Point de montage (doit être un point de montage réel : vérifié par findmnt)
# et sous-dossier des archives.
NAS="/media/NAS"
BACKUP_SUBDIR="backup/data2restore"

# -----------------------------------------------------------------------------
# Profils sauvegardés
# -----------------------------------------------------------------------------
# SOURCES[PROFIL] = chemin RELATIF à $HOME.
# Un profil retiré devient « orphelin » : ses archives restent sur le NAS et ne
# sont supprimées que par `delete_old --purge-orphans`.
# >>> SOURCES
SOURCES=(
	["BRAVE"]=".config/BraveSoftware"
	["DOCUMENTS"]="Documents"
	["IPTVNATOR"]=".iptvnator"
	["PROJECTS"]="Projects"
	["SSH"]=".ssh"
	["ZSH_HISTORY"]=".local/share/zsh/zsh_history"
)
# <<< SOURCES

# Binaire à surveiller : si ce processus tourne, le profil est ignoré
# (sauvegarde) ou refusé (restauration), pour éviter une archive incohérente.
# >>> COMMANDS
COMMANDS=(
	["BRAVE"]="brave"
	["IPTVNATOR"]="iptvnator.bin"
)
# <<< COMMANDS

# Service utilisateur arrêté pendant l'opération et redémarré dans tous les cas
# (y compris sur erreur ou interruption).
# >>> SERVICES
SERVICES=(
)
# <<< SERVICES

# Motifs exclus de l'archive, séparés par « | ». Un motif sans « / » cible un
# nom de dossier, à n'importe quelle profondeur (ex. « target » exclut
# Projects/rustTV/target mais pas Projects/mon-target).
# >>> EXCLUDES
EXCLUDES=(
	["BRAVE"]="Cache|Code Cache|GPUCache|Service Worker|ScriptCache|ShaderCache|GrShaderCache|DawnCache|Crashpad|extensions_crx_cache|component_crx_cache|adblock_cache|SingletonLock|SingletonCookie|SingletonSocket"
	["PROJECTS"]="target|node_modules|__pycache__|.venv|venv|.mypy_cache|.pytest_cache|.ruff_cache"
)
# <<< EXCLUDES

# -----------------------------------------------------------------------------
# Comportement
# -----------------------------------------------------------------------------
# Archives conservées par profil par `delete_old`.
KEEP_DEFAULT=2

# Vérifier l'intégrité après écriture (relit l'archive : coûteux sur un gros
# profil, contournable avec --no-verify). 1 = oui, 0 = non.
VERIFY_DEFAULT=1

# Instantané de l'état courant avant une restauration :
#   auto = seulement si la cible fait moins de SNAPSHOT_MAX_MB
#   yes  = toujours    no = jamais
SNAPSHOT_DEFAULT="yes"
SNAPSHOT_MAX_MB=512

# Délai maximal (secondes) accordé aux vérifications de montage NFS.
NAS_TIMEOUT=20

# -----------------------------------------------------------------------------
# Chiffrement (optionnel)
# -----------------------------------------------------------------------------
# ENCRYPT=""    : archives .tar.gz en clair
# ENCRYPT="gpg" : archives .tar.gz.gpg, nécessite GPG_RECIPIENT (identifiant
#                 ou empreinte de clé publique)
# ENCRYPT="age" : archives .tar.gz.age, nécessite AGE_RECIPIENT (age1...)
ENCRYPT=""
GPG_RECIPIENT=""
AGE_RECIPIENT=""
